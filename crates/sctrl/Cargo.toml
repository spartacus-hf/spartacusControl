[package]
name = "sctrl"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_plot = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sctrl-core = { version = "0.1.0", path = "../core" }
sctrl-proto = { version = "0.1.0", path = "../proto" }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
