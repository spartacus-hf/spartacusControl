[workspace]
resolver = "3"
members = ["crates/proto", "crates/core", "crates/sctrl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/vpcsln/spartacusControl"
authors = ["Cem ASLAN"]
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
